name: Feature request
description: Something the terminal should be able to do
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The task, not the solution. What is friction today.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you have in mind
    validations:
      required: true

  - type: textarea
    id: prior_art
    attributes:
      label: Prior art
      description: >
        Which terminals or protocols already do this, and how. A pointer to a spec or to
        another implementation's source is the fastest path to it getting built.

  - type: textarea
    id: verification
    attributes:
      label: How would it be proven
      description: >
        Optional. Nothing lands here without a test that has been seen to fail, so if you
        already know what the oracle would be, say so.
