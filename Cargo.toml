[workspace]
resolver = "3"
members = [
    "crates/vte",
    "crates/snapshot",
    "crates/ghostty",
    "crates/core",
    "crates/frame",
    "crates/pty",
    "crates/render",
    "crates/difftest",
    "crates/abi",
    "crates/abi-types",
    "crates/host",
    "crates/markdown",
    "crates/cli",
]

[workspace.package]
edition = "2024"
rust-version = "1.85"
# Publishing is OFF, and flipping it is a decision rather than a chore. Two things have to be
# settled first: this is AGPL-3.0-only, which on a LIBRARY means anyone linking it must release
# their whole application under the same terms - so the drop-in C ABI is legally true and
# practically unusable to a commercial embedder; and the ABI is still moving (every symbol in it
# was renamed on 2026-08-08). Everything else about publishing is prepared, so the day both are
# settled this is a one-line change plus `cargo publish` per crate in dependency order.
publish = false
license = "AGPL-3.0-only"
repository = "https://github.com/Orellius/termisu"

[workspace.dependencies]
termisu-vt-snapshot = { path = "crates/snapshot", version = "0.1.0" }
termisu-vt-ghostty = { path = "crates/ghostty" } # no version: never published, see its manifest
termisu-vt-core = { path = "crates/core", version = "0.1.0" }
termisu-vt-frame = { path = "crates/frame", version = "0.1.0" }
termisu-vt-pty = { path = "crates/pty", version = "0.1.0" }
termisu-vt-render = { path = "crates/render", version = "0.1.0" }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
