[[case]]
name = "mouse-raw-bits-are-independent"
expect = "match"
bytes = "\u001B[?1000h\u001B[?1002h\u001B[?1002l"
note = "The trap this family carries: the oracle records every mode's RAW bit before deriving its last-writer event kind (stream_terminal.zig setMode), so after 1000h 1002h 1002l the 1000 bit is STILL SET (DECRQM answers 1) even though the derived kind dropped to none and reporting is off. A core that stores only the-current-mode answers this wrong; went in as diff, promoted by the raw-bit implementation."

[[case]]
name = "mouse-1007-alternate-scroll-default-on"
expect = "match"
bytes = "\u001B[?1007l"
note = "Alternate scroll is the one mouse mode that DEFAULTS ON (modes.zig marks it .default = true). The 1007l pins BOTH halves at once: the shared on-default (a wrong candidate default would add a second path on every other mouse case) and the reset direction, measured 2026-07-30 as oracle=false candidate=true before the core routed 1007, then promoted by the implementation."

[[case]]
name = "mouse-1007-restored-by-ris"
expect = "match"
bytes = "\u001B[?1007l\u001Bc"
note = "RIS returns modes to their DEFAULTS, not to false: 1007 comes back ON after a reset. Green while both sides default on; guards full_reset once the core routes 1007."

[[case]]
name = "mouse-modes-survive-the-alt-screen"
expect = "match"
bytes = "\u001B[?1000h\u001B[?1006h\u001B[?1049h"
note = "Mouse modes are terminal-global like 2004: entering the alternate screen keeps them. vim enables 1000/1006 and then 1049h -- clearing on the switch would kill its mouse support exactly when it starts. Went in as diff, promoted by the implementation."

[[case]]
name = "sync-2026-tracked"
expect = "match"
bytes = "\u001B[?2026hbatch"
note = "Synchronized output (mode 2026) is tracked state both sides report through ghostty_terminal_mode_get; the BATCHING itself is the pump's publish gate, outside the core by design."

[[case]]
name = "sync-2026-cleared-by-resize"
expect = "match"
cols = 10
rows = 4
resize = { cols = 12, rows = 4 }
bytes = "\u001B[?2026hx"
note = "MEASURED 2026-07-30: the oracle clears 2026 on resize (its own test pins even the unchanged-dimensions direction); a program holding the gate across a resize would freeze the redraw the user just asked for."

[[case]]
name = "sync-2026-survives-alt-switch"
expect = "match"
bytes = "\u001B[?2026h\u001B[?1049halt"
note = "2026 is terminal-global like 2004: entering the alternate screen keeps the batch open."

[[case]]
name = "mode-1-decckm-tracked"
expect = "match"
bytes = "\u001B[?1h"
note = "DECCKM (application cursor keys). Tracked because the host arrow and alternate-scroll paths pick ESC O over ESC [ by it; the raw bit is the observable via ghostty_terminal_mode_get. Added with the SGR mouse slice 2026-07-30."

[[case]]
name = "mode-1-decckm-across-decstr"
expect = "diff"
diff_paths = ["modes.cursor_keys"]
bytes = "\u001B[?1h\u001B[!p"
note = "The DECSTR divergence seen through DECCKM: the oracle has no ! dispatch so it keeps mode 1 set; this core soft-resets it, xterm way (xterm DECSTR resets DECCKM). Same deliberate divergence as decstr-soft-reset-diverges, pinned on the one mode the wheel routing reads."

[[case]]
name = "mode-66-keypad-application"
expect = "match"
bytes = "\u001B[?66h"
note = "DECKPAM via the CSI spelling. Tracked for the host key encoder; observable through ghostty_terminal_mode_get. Added with the kitty keyboard slice 2026-07-30 -- routing landed with the harness, so the comparator control (each_mouse_mode_bit_disagreement...) is the discriminating guard for the comparison itself."

[[case]]
name = "mode-66-esc-equals-spelling"
expect = "match"
bytes = "\u001B="
note = "DECKPAM via ESC =. The oracle routes it through the same mode-66 table entry as CSI ?66h (stream.zig emits set_mode), so mode_get observes both spellings identically -- this pins that our ESC dispatch does too."

[[case]]
name = "mode-1035-default-on"
expect = "match"
bytes = "\u001B[?1035l"
note = "ignore_keypad_with_numlock DEFAULTS ON (modes.zig .default = true); the 1035l pins the shared default and the reset direction at once, the 1007 pattern."

[[case]]
name = "mode-1036-default-on"
expect = "match"
bytes = "\u001B[?1036l"
note = "alt_esc_prefix DEFAULTS ON; same shape as 1035."

[[case]]
name = "mode-66-keypad-across-decstr"
expect = "diff"
diff_paths = ["modes.keypad_keys"]
bytes = "\u001B=\u001B[!p"
note = "The DECSTR divergence seen through the keypad: the oracle has no ! dispatch and keeps mode 66 set; this core soft-resets it (VT510 DECSTR table lists the keypad returning to numeric). Same deliberate divergence family as decstr-soft-reset-diverges and the DECCKM pin."

[[case]]
name = "osc7-reports-the-pwd"
expect = "match"
bytes = "\u001B]7;file:///Users/example/src\u001B\\"
note = "OSC 7 working directory. Observable via GHOSTTY_TERMINAL_DATA_PWD, so unlike OSC 8 or OSC 52 this has a real oracle. Filed diff BEFORE the core tracked anything; the promotion to match is the evidence."

[[case]]
name = "osc7-bel-terminated"
expect = "match"
bytes = "\u001B]7;file:///tmp\u0007"
note = "BEL is what zsh's precmd actually emits; a parser accepting only ST looks green in every test and dies on every real prompt."

[[case]]
name = "osc7-payload-is-stored-raw"
expect = "match"
bytes = "\u001B]7;file:///Users/example/My%20Code\u001B\\"
note = "Percent-encoding is NOT decoded and the value is never validated (stream_terminal.zig reportPwd stores it raw). A helpful decoder diverges on every path containing a space."

[[case]]
name = "osc7-not-a-uri-is-stored-anyway"
expect = "match"
bytes = "\u001B]7;/plain/path\u001B\\"
note = "The oracle validates nothing, so a bare path is stored as-is. This is the case that kills a 'reject anything without file://' implementation."

[[case]]
name = "osc7-second-report-replaces-the-first"
expect = "match"
bytes = "\u001B]7;file:///one\u001B\\\u001B]7;file:///two\u001B\\"
note = "Last writer wins and there is no history. Kills an implementation that appends or keeps the first."

[[case]]
name = "osc7-survives-the-alternate-screen"
expect = "match"
bytes = "\u001B]7;file:///primary\u001B\\\u001B[?1049h"
note = "The pwd lives on Terminal, not Screen, so a buffer switch cannot disturb it. Pins terminal-global storage, the same shape as modes 2004 and 2026."

[[case]]
name = "osc7-empty-clears"
expect = "match"
bytes = "\u001B]7;file:///tmp\u001B\\\u001B]7;\u001B\\"
note = "An empty payload clears the pwd (Terminal.zig setPwd). Both sides read empty today so this matches vacuously; it becomes a real assertion the moment tracking lands, which is why it is pinned now rather than after."

[[case]]
name = "osc7-ris-clears"
expect = "match"
bytes = "\u001B]7;file:///tmp\u001B\\\u001Bc"
note = "RIS clears the pwd (fullReset). Same shape as the empty case: vacuous today, load-bearing after the core tracks it."

[[case]]
name = "osc9-9-conemu-sets-the-pwd"
expect = "match"
bytes = "\u001B]9;9;/Users/example/from-conemu\u001B\\"
note = "ConEmu CurrentDir feeds the SAME pwd as OSC 7 (measured against the oracle 2026-07-31). Pinned because before this the sequence fell through to the notification branch and popped a desktop notification reading '9;/Users/example/from-conemu'. Payload is a bare path here, not a URI; the core stores either verbatim."

[[case]]
name = "osc4-sets-an-indexed-palette-entry"
expect = "match"
bytes = "\u001B]4;1;#ff0000\u0007"
note = "OSC 4 overrides palette index 1. Promoted DIFF->MATCH by the colour slice 2026-08-01."

[[case]]
name = "osc4-sets-two-entries-in-one-command"
expect = "match"
bytes = "\u001B]4;1;rgb:12/34/56;2;#0f0\u0007"
note = "OSC 4 takes repeating index;spec pairs; rgb:RR/GG/BB and #RGB shorthand both parse, and #RGB scales v*255/15 (f -> 255, the oracle rule, not xterm truncation). Promoted by the colour slice."

[[case]]
name = "osc10-sets-the-dynamic-foreground"
expect = "match"
bytes = "\u001B]10;#20df80\u0007"
note = "OSC 10 sets the effective foreground. Promoted by the colour slice."

[[case]]
name = "osc10-second-param-falls-through-to-osc11"
expect = "match"
bytes = "\u001B]10;#20df80;rgb:10/20/30\u0007"
note = "A second OSC 10 parameter addresses the NEXT dynamic colour (xterm rule the oracle keeps). Promoted by the colour slice."

[[case]]
name = "osc11-sets-the-dynamic-background"
expect = "match"
bytes = "\u001B]11;rgb:1212/3434/5656\u0007"
note = "OSC 11 sets the effective background; rgb: accepts 1-4 hex digits per channel. Promoted by the colour slice."

[[case]]
name = "osc12-sets-the-cursor-colour"
expect = "match"
bytes = "\u001B]12;#c0ffee\u001B\\"
note = "OSC 12 sets the cursor colour; ST termination covered here, BEL elsewhere in the family. Promoted by the colour slice. The snapshot cursor mirrors the DATA getter (no foreground fallback; that fallback is query-reply behaviour only)."

[[case]]
name = "osc12-sets-the-cursor-colour"
expect = "match"
bytes = "\u001B]12;#c0ffee\u001B\\"
note = "OSC 104;3 returns index 3 to the default table. Load-bearing since the colour slice: a core that sets without resetting diffs here."

[[case]]
name = "osc12-sets-the-cursor-colour"
expect = "match"
bytes = "\u001B]12;#c0ffee\u001B\\"
note = "OSC 110 clears the OSC 10 override. Load-bearing since the colour slice, same shape as osc104-resets-an-overridden-index."

[[case]]
name = "colours-survive-a-full-reset"
expect = "match"
bytes = "\u001B]4;1;#ff0000\u0007\u001B]10;#20df80\u0007\u001Bc"
note = "RIS does NOT reset colour state: the oracle's fullReset resets modes, tabs, pwd, title and screens and never touches colors, so the palette override and the dynamic foreground ride through. Counterintuitive enough that a plausible implementation resets them; this pin is what catches that."

[[case]]
name = "osc4-error-stops-the-list-but-keeps-the-prefix"
expect = "match"
bytes = "\u001B]4;1;#ff0000;notanumber;#00ff00;2;#0000ff\u0007"
note = "xterm's ChangeAnsiColorRequest rule, kept by the oracle: an unparseable index stops the whole list, keeping what parsed before it. Index 1 turns red; index 2 must NOT turn blue."

[[case]]
name = "decfra-fills-diverging-from-the-oracle"
expect = "diff"
diff_paths = ["cell[0,0].text", "cell[0,1].text", "cell[1,0].text", "cell[1,1].text"]
bytes = "\u001B[37;1;1;2;2$x"
note = "DECFRA fills a rect with '%'. The oracle has NO dollar-intermediate grid ops (measured 2026-08-01: no $x/$z/$v dispatch in stream_terminal.zig), so this is a deliberate divergence in xterm's direction - the DECSTR pattern. esctest asserts the xterm behaviour."

[[case]]
name = "decera-erases-diverging-from-the-oracle"
expect = "diff"
diff_paths = ["cell[0,0].text", "cell[0,1].text", "cell[1,0].text", "cell[1,1].text"]
bytes = "ab\r\ncd\u001B[1;1;2;2$z"
note = "DECERA blanks the rect; the oracle ignores the sequence and keeps ab/cd. Same deliberate xterm-direction divergence as DECFRA."

[[case]]
name = "deccra-copies-diverging-from-the-oracle"
expect = "diff"
diff_paths = ["cell[1,0].text", "cell[1,1].text"]
bytes = "ab\u001B[1;1;1;2;1;2;1;1$v"
note = "DECCRA copies row 1's 'ab' onto row 2; the oracle ignores it. Same deliberate xterm-direction divergence family."

[[case]]
name = "ansi-modes-track-like-the-oracle"
expect = "match"
bytes = "\u001B[2h\u001B[4h\u001B[20h\u001B[12l"
note = "SM sets KAM/IRM/LNM and RM clears SRM - the oracle's exact ANSI mode set, compared as state on every case since the DECRQM slice."

[[case]]
name = "lnm-linefeed-returns-the-carriage"
expect = "match"
bytes = "abc\u001B[20h\ndef"
note = "With LNM set, LF also does CR (the oracle's linefeed(): index then carriageReturn), so 'def' starts at column 0 of the next row rather than column 3."

[[case]]
name = "reverse-video-and-backarrow-track"
expect = "match"
bytes = "\u001B[?5h\u001B[?67h\u001B[?4h"
note = "DECSCNM, DECBKM and DECSCLM are tracked state in the oracle's table; consumers live outside the core."

[[case]]
name = "ansi-modes-survive-nothing-special-but-ris-resets-them"
expect = "match"
bytes = "\u001B[4h\u001B[?5h\u001Bc"
note = "RIS returns every tracked mode to its default (modes.reset() in fullReset) - insert off, reverse video off, SRM back to SET."

[[case]]
name = "decsca-protected-cells-survive-decsed"
expect = "match"
bytes = "\u001B[1\"qabc\u001B[0\"qX\u001B[1;1H\u001B[?0J"
note = "DECSCA-protected abc survives DECSED while the unprotected X goes - both sides implement the DEC protection matrix (the oracle's eraseDisplay takes protected_req)."

[[case]]
name = "iso-protection-guards-even-plain-erases"
expect = "match"
bytes = "\u001BVab\u001BWcd\u001B[1;1H\u001B[0J"
note = "SPA/EPA: with ISO as the most recent protection mode, even the PLAIN erases spare protected cells - the oracle's protected_mode == .iso arm. ab survives a bare ED."

[[case]]
name = "decsc-carries-the-protection-pen"
expect = "match"
bytes = "\u001B[1\"qa\u001B7\u001B[0\"qb\u001B8c\u001B[1;1H\u001B[?0J"
note = "DECSC saves the protection pen and DECRC restores it: c prints protected again after the restore, so a and c survive the selective erase and b does not."

[[case]]
name = "ech-respects-iso-protection-only"
expect = "match"
bytes = "\u001BVab\u001BWcd\u001B[1;1H\u001B[4X"
note = "ECH consults the most recent protection mode (the oracle's eraseChars comment is the whole reason the mode is never reset to off): under ISO it spares ab."

[[case]]
name = "decsera-respects-protection-diverging"
expect = "diff"
diff_paths = ["cell[0,0].text", "cell[0,2].text"]
bytes = "a\u001B[1\"qb\u001B[0\"qc\u001B[1;1;1;8${"
note = "DECSERA blanks the unprotected a and c and spares the protected b; the oracle has no dollar-intermediate rect ops, keeps all three. Same divergence family as DECFRA/DECERA/DECCRA."

[[case]]
name = "decsed-erases-iso-protected-diverging"
expect = "diff"
diff_paths = ["cell[0,1].text"]
bytes = "a\u001BVb\u001BW\u001B[1;1H\u001B[?2J"
note = "The one seam where the two protection models split: DECSED on an ISO-protected cell. xterm (and esctest's DECSED_doesNotRespectISOProtect) ERASE it - selective erases spare only DECSCA cells - while the oracle's protected = iso_or_requested spares it. This core takes xterm's side deliberately: the oracle's model leaks an ISO cell through esctest's own between-test ED(2), making the whole suite order-dependent, the same disease its missing DECSTR causes. Divergence class: DECSTR pattern."

[[case]]
name = "probe-iso-protection-against-complete-erase"
expect = "match"
bytes = "a\u001BVb\u001BW\u001B[1;1H\u001B[2J"
note = "MEASURED: a complete erase (ED 2) DOES spare an ISO-protected cell, on both sides. Kept as a pin because it is the fact that forced DECSTR to strip protection - without that, esctest carries a protected cell across its own between-test reset."

[[case]]
name = "osc2-sets-the-window-title"
expect = "match"
bytes = "\u001B]2;hello world\u0007"
note = "OSC 2 sets the window title, a real differential observable (the oracle answers GHOSTTY_TERMINAL_DATA_TITLE). Before the winops slice the core raised a Title EVENT and stored nothing, so a snapshot could not see it at all."

[[case]]
name = "osc1-sets-only-the-icon-title"
expect = "match"
bytes = "\u001B]2;window\u0007\u001B]1;icon\u0007"
note = "OSC 1 addresses the ICON title only, so the window title must survive it. The oracle has no icon title, which is exactly why this case is worth pinning: a core that let OSC 1 overwrite the window title would diverge HERE and nowhere else."

[[case]]
name = "ris-clears-the-title"
expect = "match"
bytes = "\u001B]2;doomed\u0007\u001Bc"
note = "RIS clears the title (the oracle's fullReset clears its title buffer)."

[[case]]
name = "declrmm-decslrm-sets-margins-and-homes"
expect = "match"
bytes = "\u001B[?69h\u001B[3;6s"
note = "DECSLRM under mode 69 sets the column band and HOMES the cursor (setCursorPos(1,1)). Both sides implement left/right margins - the oracle carries scrolling_region.left/right - so this whole family is differentially measurable, not source-referenced."

[[case]]
name = "decslrm-is-refused-without-mode-69"
expect = "match"
bytes = "\u001B[3;6s"
note = "Without DECLRMM, CSI s is SCOSC (save cursor) and sets no margins - the ambiguity the oracle resolves in its handler rather than its parser. A core that always parsed DECSLRM would move the cursor here and diverge."

[[case]]
name = "carriage-return-lands-on-the-left-margin"
expect = "match"
bytes = "\u001B[?69h\u001B[3;6s\u001B[1;5Habc\r X"
note = "CR returns to the LEFT MARGIN, not column 0, when the cursor is at or right of it (Terminal.zig:1676)."

[[case]]
name = "carriage-return-left-of-the-margin-goes-to-column-zero"
expect = "match"
bytes = "\u001B[?69h\u001B[3;6s\u001B[1;2Hab\rZ"
note = "The arm a plausible implementation misses: a cursor LEFT of the margin gets a real carriage return to column 0, which is what lets a program write outside the band."

[[case]]
name = "backspace-crosses-the-left-margin"
expect = "match"
bytes = "\u001B[?69h\u001B[3;6s\u001B[1;3H\b\b\bX"
note = "MEASURED, against my own wrong assumption: BS and CUB clamp at COLUMN 0 and ignore the left margin. The oracle cursorLeft takes a fast path when no reverse-wrap mode is active (Terminal.zig:1766) and its margin-aware floor is reachable only through the reverse-wrap walk, which mode 45 gates and neither side implements. CUF still stops at the RIGHT margin, so the pair is genuinely asymmetric. This case failed first with the cursor three columns off, which is how the rule got found rather than guessed."

[[case]]
name = "cuf-stops-at-the-right-margin"
expect = "match"
bytes = "\u001B[?69h\u001B[3;6s\u001B[1;3H\u001B[20CX"
note = "CUF clamps to the right margin while the cursor is at or left of it (Terminal.zig:1743)."

[[case]]
name = "printing-wraps-at-the-right-margin"
expect = "match"
bytes = "\u001B[?69h\u001B[2;5s\u001B[1;2Habcdefgh"
note = "Printing wraps at the RIGHT MARGIN and the wrap lands on the LEFT MARGIN (printWrap ends with cursorHorizontalAbsolute(left)), so the text stays inside the column band across rows."

[[case]]
name = "ich-and-dch-stay-inside-the-band"
expect = "match"
bytes = "\u001B[?69h\u001B[2;5s\u001B[1;1Habcdefgh\u001B[1;2H\u001B[2@\u001B[2;1Hijklmnop\u001B[2;2H\u001B[2P"
note = "ICH pushes cells off the RIGHT MARGIN rather than past it, and DCH pulls from inside the band - so neither smears into text parked outside the margins."

[[case]]
name = "scrolling-only-moves-the-column-band"
expect = "match"
bytes = "\u001B[?69h\u001B[3;6s\u001B[1;1Habcdefgh\r\nijklmnop\u001B[1;3H\u001B[1M"
note = "DL scrolls only the banded columns: cells outside the margins hold still, which is the entire point of a column band."

[[case]]
name = "mode-40-is-pure-stored-state"
expect = "match"
bytes = "\u001B[?40h"
note = "DECSET 40 (Allow80To132) stores the bit and does nothing else - the oracle's setMode arm is literally empty (stream_terminal.zig: .enable_mode_3 => {}). The bit is the whole observable."

[[case]]
name = "deccolm-is-inert-without-mode-40"
expect = "match"
bytes = "ab\u001B[?3h"
note = "DECSET 3 without mode 40 is fully ignored: deccolm (Terminal.zig:3644) forces 132_column FALSE and returns before touching the grid. Content survives, width stays, cursor stays. The gate direction of the DECCOLM family."

[[case]]
name = "deccolm-132-resizes-erases-and-homes"
expect = "match"
bytes = "\u001B[5;5Hxyz\u001B[?40h\u001B[?3h"
note = "With mode 40 armed, DECSET 3 is the full VT sequence: resize to 132 columns, erase the display completely, home the cursor (deccolm: resize, eraseDisplay(.complete), setCursorPos(1,1)). Grid width, content, cursor and the mode bit all move at once."

[[case]]
name = "deccolm-back-to-80-erases-again"
expect = "match"
bytes = "\u001B[?40h\u001B[?3habc\u001B[?3l"
note = "DECRST 3 with the grant is deccolm(80_cols): the same resize-erase-home, pointed the other way. Content printed in 132-column mode does not survive the return trip."

[[case]]
name = "deccolm-resets-margins-and-scroll-region"
expect = "match"
bytes = "\u001B[?40h\u001B[?69h\u001B[3;6s\u001B[?3hab\rX"
note = "deccolm calls resize, and resize resets the scrolling region on ALL FOUR edges (Terminal.zig resize tail). After DECCOLM the CR lands on column 0, not the old left margin - the discriminating cell for a core that resized without clearing the band."

[[case]]
name = "deccolm-set-without-grant-forces-the-bit-off"
expect = "match"
bytes = "\u001B[?40h\u001B[?3h\u001B[?40l\u001B[?3h"
note = "Adversarial edge measured off the oracle's order of operations: setMode stores 132_column=true unconditionally, THEN deccolm sees mode 40 off and forces it back FALSE without resizing. So a SET of mode 3 after the grant is revoked turns the bit OFF while the grid stays 132 wide. A core that gates the store but skips the force-false diverges here."

[[case]]
name = "ris-clears-deccolm-state-but-keeps-the-width"
expect = "match"
bytes = "\u001B[?40h\u001B[?3h\u001Bc"
note = "fullReset (Terminal.zig:4459) resets the mode table - modes 3 and 40 both drop - but performs NO resize, so the grid stays 132 columns wide after RIS. xterm resizes back to 80 here and esctest asserts that; we follow the oracle and lose test_RIS_ResetDECCOLM on the width half, deliberately."

# ---------------------------------------------------------------------------
# D2 SELECTION. These are the first cases in the corpus that ask a QUESTION rather
# than only writing bytes: `select` derives a range from a point after the stream has
# run. libghostty-vt answers through ghostty_terminal_select_word/line/all plus its
# formatter, so word boundaries, line trimming and the clipboard text are all measured
# against the real thing instead of agreed with ourselves.
#
# Every one of them is `diff` today because `Terminal::select` reports "no selectable
# content" for everything. That is the harness being shown to SEE selection before a
# line of it is written - the failure these produce when selection lands is the feature,
# and each gets promoted to `match` then.
# ---------------------------------------------------------------------------

[[case]]
name = "select-word-in-the-middle"
expect = "match"
bytes = "hello world"
select = [{ kind = "word", x = 2, y = 0 }]
note = "The simplest word selection there is: a point inside 'hello' selects 'hello' and not the line."

[[case]]
name = "select-word-at-its-last-cell"
expect = "match"
bytes = "hello world"
select = [{ kind = "word", x = 4, y = 0 }]
note = "The boundary cell belongs to the word. An off-by-one in the forward scan stops one short here and nowhere else."

[[case]]
name = "select-word-on-the-space-between-words"
expect = "match"
bytes = "hello world"
select = [{ kind = "word", x = 5, y = 0 }]
note = "Whitespace is its own run in Ghostty's rules, not a boundary that snaps to a neighbour. Measured rather than assumed - a plausible implementation returns the word to the left."

[[case]]
name = "select-word-across-punctuation"
expect = "match"
bytes = "foo.bar baz"
select = [{ kind = "word", x = 1, y = 0 }]
note = "Whether '.' bounds a word is a boundary-codepoint question with a real answer in the oracle, and it is the difference between selecting a filename and selecting its stem."

[[case]]
name = "select-word-on-a-blank-cell"
expect = "match"
bytes = "hi"
select = [{ kind = "word", x = 10, y = 0 }]
note = "MEASURED: past the text the oracle answers NO_VALUE - a blank cell has no word. Passing today only because the candidate answers nothing for everything, so it is a pin on the oracle rather than proof about us; when selection lands it becomes the case that stops a word scan from selecting a run of blanks."

[[case]]
name = "select-word-hebrew"
expect = "match"
bytes = "שלום עולם"
select = [{ kind = "word", x = 1, y = 0 }]
note = "The word rules must not be ASCII-only. Selection is logical, never visual - the range is in grid order and reordering is the renderer's business."

[[case]]
name = "select-word-wide-cell"
expect = "match"
bytes = "你好 world"
select = [{ kind = "word", x = 1, y = 0 }]
note = "MEASURED, not assumed: x=1 is the spacer tail of a wide cell and the oracle answers NO_VALUE there - a spacer tail has no word. Passing today only because the candidate answers nothing for everything; once selection lands this case demands it keeps answering nothing HERE, which is the half a word implementation gets wrong by scanning cells rather than clusters."

[[case]]
name = "select-line-simple"
expect = "match"
bytes = "hello world"
select = [{ kind = "line", x = 3, y = 0 }]
note = "A line selection covers the whole line whatever column it is asked from, trimmed of trailing blanks."

[[case]]
name = "select-line-with-trailing-blanks"
expect = "match"
bytes = "abc   "
select = [{ kind = "line", x = 0, y = 0 }]
note = "Trailing whitespace is trimmed by the line rules AND by the formatter. Two independent trims, and a range that keeps them while the text drops them is a real disagreement this case can see."

[[case]]
name = "select-line-across-a-soft-wrap"
expect = "match"
cols = 10
bytes = "abcdefghijklmno"
select = [{ kind = "line", x = 2, y = 1 }]
note = "One logical line spanning two rows. Asked from the continuation row, the selection must reach back to the row that started it - the case a row-shaped implementation gets wrong."

[[case]]
name = "select-line-on-the-second-of-two-hard-lines"
expect = "match"
bytes = "one\r\ntwo"
select = [{ kind = "line", x = 1, y = 1 }]
note = "The mirror of the soft-wrap case: a hard line break really is a boundary, so a line selection must NOT reach back. An implementation that always joins upward passes the previous case and fails this one."

[[case]]
name = "select-all-two-lines"
expect = "match"
bytes = "one\r\ntwo"
select = [{ kind = "all", x = 0, y = 0 }]
note = "Select-all covers every selectable cell, which is not the same as every cell: the blank rows below the text are the question."

[[case]]
name = "select-all-with-scrollback"
expect = "match"
rows = 2
scrollback = 100
bytes = "one\r\ntwo\r\nthree\r\nfour"
select = [{ kind = "all", x = 0, y = 0 }]
note = "Whether select-all reaches into history is the whole question for a terminal with scrollback, and it decides what cmd+A gives the operator."

[[case]]
name = "two-probes-on-one-grid"
expect = "match"
bytes = "alpha beta"
select = [{ kind = "word", x = 0, y = 0 }, { kind = "word", x = 7, y = 0 }]
note = "Two probes against one grid, so the probe list is proven to be a list rather than a single hidden slot - and the paths carry their index."

[[case]]
name = "select-word-with-scrollback-above"
expect = "match"
rows = 2
scrollback = 100
bytes = "one\r\ntwo\r\nthree\r\nfour"
select = [{ kind = "word", x = 1, y = 0 }]
note = "The coordinate seam, and nothing else in the corpus could see it: the probe point is ACTIVE-relative (row 0 of a two-row screen) while the range comes back ABSOLUTE, counting the two rows that scrolled into history. A candidate that forgets the offset reports a word from the wrong line entirely and looks perfectly correct on every case with no scrollback - which is every other selection case here."

[[case]]
name = "select-word-filling-a-whole-row"
expect = "match"
cols = 5
bytes = "abcde"
select = [{ kind = "word", x = 1, y = 0 }]
note = "The word ends exactly at the last column of a row that does not soft-wrap. That cell BELONGS to the word, and it is the one place the forward scan takes its inclusive branch - a scan that returns the previous cell there loses the last character of every word that fills a line, and every other case in this corpus stays green. Added after a mutant with that exact shape survived the whole corpus."
