[package]
name = "termisu-vt-ghostty"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
# NEVER publishable: build.rs links libghostty-vt, built from a local Ghostty checkout via
# TERMISU_VT_ORACLE_SRC. It cannot build on docs.rs or on anyone else's machine, and it is a
# test oracle rather than a library anyone would consume.
publish = false

[dependencies]
termisu-vt-snapshot.workspace = true
thiserror.workspace = true

[build-dependencies]
bindgen = "0.72"

[dev-dependencies]
termisu-vt-abi-types = { path = "../abi-types", version = "0.1.0" }
termisu-vt-core.workspace = true
termisu-vt-pty.workspace = true
serde_json = "1"
