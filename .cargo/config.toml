# Pin the target dir LOCALLY, overriding the machine-global build cache
# redirect in ~/.cargo/config.toml (closer config wins). This repo cannot use
# the shared root: the differential-oracle scripts reference ./target/debug by
# literal path. It also served swift/Package.swift, which linked the staticlib
# at -L../target/release until that host was deleted on 2026-08-08 - one of the
# two reasons is gone and the other is not. Remove this pin only after those
# paths are made CARGO_TARGET_DIR-aware.
[build]
target-dir = "target"
